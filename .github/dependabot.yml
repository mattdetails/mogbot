# Keeps dependencies current and raises security fixes as PRs.
# Weekly; security updates are grouped per ecosystem and directory so one
# advisory is one PR. Actions are SHA-pinned (ci.yml etc.), and Dependabot
# moves the pin and its version comment together.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    groups:
      npm-root-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-root-minor:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
